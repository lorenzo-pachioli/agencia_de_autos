server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agencia_de_autos_db?useSSL=false&serverTimezone=UTC
    username: root
    password: emiliano
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace