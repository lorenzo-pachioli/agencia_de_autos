server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432}
    username: ${DB_USERNAME:root}
    password:  ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      keep-alive-time: 300000
      connection-timeout: 20000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

# CONFIGURACIÓN DE SWAGGER / OPENAPI PARA SPRING BOOT 4
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  use-management-port: false

jwt:
  secret-key: ${SECRET_KEY:4e7d8c9b1a2f3e5d6c7b8a9f0e1d2c3b4a5f6e7d8c9b1a2f3e5d6c7b8a9f0e1d}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
