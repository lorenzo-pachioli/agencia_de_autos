<h2 mat-dialog-title>{{ esSenia ? 'Registrar seña' : 'Confirmar venta' }}</h2>
<form class="dialog-form" (ngSubmit)="confirmar()">
  <mat-dialog-content>
    <p class="dialog-description">Transacción #{{ data.transaccion.id }} · {{ data.transaccion.patente }}</p>
    <mat-form-field appearance="outline">
      <mat-label>{{ esSenia ? 'Monto de la seña' : 'Precio final de venta' }}</mat-label>
      <input matInput type="number" min="1" name="monto" [(ngModel)]="monto" required>
    </mat-form-field>
    @if (error()) { <p class="form-error">{{ error() }}</p> }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="button" matButton="outlined" class="button-outline" (click)="cerrar()">Volver</button>
    <button matButton="filled" class="button-dark" type="submit">{{ esSenia ? 'Registrar seña' : 'Vender' }}</button>
  </mat-dialog-actions>
</form>
