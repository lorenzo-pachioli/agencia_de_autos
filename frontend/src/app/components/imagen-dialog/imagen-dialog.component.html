<h2 mat-dialog-title>{{ esEdicion ? 'Editar imagen' : 'Nueva imagen' }}</h2>

<form class="dialog-form" (ngSubmit)="confirmar()">

  <mat-dialog-content>

    @if (url()) {
      <img class="vista-previa" [src]="url()" alt="Vista previa de la imagen">
    } @else {
      <div class="vista-previa sin-imagen">Sin imagen seleccionada</div>
    }

    <input #selectorArchivo type="file" [accept]="tiposPermitidos" hidden (change)="seleccionarArchivo($event)">
    <button matButton="outlined" class="button-outline" type="button" (click)="selectorArchivo.click()">
      {{ url() ? 'Cambiar imagen' : 'Elegir imagen' }}
    </button>
    <p class="formatos">JPG, PNG o WEBP, hasta {{ tamanioMaximoMb }} MB.</p>

    <mat-slide-toggle name="esPrincipal" [(ngModel)]="esPrincipal">Imagen principal</mat-slide-toggle>

  </mat-dialog-content>

  @if (envio.error()) { <p class="form-error modal-error" role="alert">{{ envio.error() }}</p> }

  <mat-dialog-actions align="end">
    <button type="button" matButton="outlined" class="button-outline" [disabled]="envio.enviando()" (click)="cerrar()">Volver</button>
    <button matButton="filled" class="button-dark" type="submit" [disabled]="envio.enviando()">{{ esEdicion ? 'Guardar' : 'Crear' }}</button>
  </mat-dialog-actions>
</form>
