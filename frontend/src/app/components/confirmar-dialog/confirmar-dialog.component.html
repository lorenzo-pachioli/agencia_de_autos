<h2 mat-dialog-title>{{ data.titulo }}</h2>

<mat-dialog-content>
  <p class="dialog-description">{{ data.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" matButton="outlined" class="button-outline" (click)="cerrar()">Volver</button>
  <button type="button" matButton="filled" class="button-danger" (click)="confirmar()">{{ data.accion }}</button>
</mat-dialog-actions>
