<h2 mat-dialog-title>{{ data.titulo }}</h2>

<mat-dialog-content>
  <p class="dialog-description">{{ data.mensaje }}</p>
</mat-dialog-content>

@if (envio.error()) { <p class="form-error modal-error" role="alert">{{ envio.error() }}</p> }

<mat-dialog-actions align="end">
  <button type="button" matButton="outlined" class="button-outline" [disabled]="envio.enviando()" (click)="cerrar()">Volver</button>
  <button type="button" matButton="filled" class="button-danger" [disabled]="envio.enviando()" (click)="confirmar()">{{ data.accion }}</button>
</mat-dialog-actions>
