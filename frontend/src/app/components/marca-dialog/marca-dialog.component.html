<h2 mat-dialog-title>{{ esEdicion ? 'Editar marca' : 'Nueva marca' }}</h2>

<form class="dialog-form" (ngSubmit)="confirmar()">

  <mat-dialog-content>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput name="nombre" [(ngModel)]="nombre" required>
    </mat-form-field>

    <mat-slide-toggle name="activo" [(ngModel)]="activo">Marca activa</mat-slide-toggle>
    
  </mat-dialog-content>

  @if (envio.error()) { <p class="form-error modal-error" role="alert">{{ envio.error() }}</p> }

  <mat-dialog-actions align="end">
    <button type="button" matButton="outlined" class="button-outline" [disabled]="envio.enviando()" (click)="cerrar()">Volver</button>
    <button matButton="filled" class="button-dark" type="submit" [disabled]="envio.enviando()">{{ esEdicion ? 'Guardar' : 'Crear' }}</button>
  </mat-dialog-actions>
</form>
