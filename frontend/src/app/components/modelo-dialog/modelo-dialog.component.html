<h2 mat-dialog-title>{{ esEdicion ? 'Editar modelo' : 'Nuevo modelo' }}</h2>

<form class="dialog-form" (ngSubmit)="confirmar()">

  <mat-dialog-content>

    <mat-form-field appearance="outline">
      <mat-label>Marca</mat-label>
      <mat-select name="marca" [(ngModel)]="marcaId" required>
        @for (marca of data.marcas; track marca.id) { 
          <mat-option [value]="marca.id">{{ marca.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput name="nombre" [(ngModel)]="nombre" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Año</mat-label>
      <input matInput type="number" [min]="anioMinimo" name="anio" [(ngModel)]="anio" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select name="tipoModelo" [(ngModel)]="tipoModelo" required>
        @for (tipo of tiposModelo; track tipo) { <mat-option [value]="tipo">{{ etiquetaTipoModelo[tipo] }}</mat-option> }
      </mat-select>
    </mat-form-field>

    <mat-slide-toggle name="activo" [(ngModel)]="activo">Modelo activo</mat-slide-toggle>

    @if (error()) { <p class="form-error">{{ error() }}</p> }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" matButton="outlined" class="button-outline" (click)="cerrar()">Volver</button>
    <button matButton="filled" class="button-dark" type="submit">
      {{ esEdicion ? 'Guardar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</form>
