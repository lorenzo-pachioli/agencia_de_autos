<main class="login">
  <form class="login__form" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
    <h1>Iniciar sesión</h1>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="login__error">Ingresá un email válido.</small>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="login__error">La contraseña es obligatoria.</small>
    }

    @if (error()) {
      <p class="login__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</main>
