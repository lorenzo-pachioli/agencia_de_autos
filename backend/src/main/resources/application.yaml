server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:agenciadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      keep-alive-time: 300000
      connection-timeout: 20000

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  use-management-port: false

jwt:
  secret-key: ${SECRET_KEY:4e7d8c9b1a2f3e5d6c7b8a9f0e1d2c3b4a5f6e7d8c9b1a2f3e5d6c7b8a9f0e1d}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}
